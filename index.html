<style>

body{
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  text-align:center;
  padding:20px;
  
  /* ======================================================== */
  /* 【核心改动】纯净冰川海蓝 3D 弥散背景（完全去除紫色元素）       */
  /* ======================================================== */
  margin:0;
  min-height:100vh;
  box-sizing:border-box;
  color:#0f172a; 
  
  /* 基础底色：高档清爽的冰浅蓝色 */
  background-color: #e0f2fe; 
  /* 3D 深色弥散光源：移除所有紫色，改用深邃海洋蓝与天蓝色交织，与冰浅蓝形成强烈 3D 空间感 */
  background-image: 
    radial-gradient(at 0% 0%, rgba(29, 78, 216, 0.4) 0px, transparent 55%),     /* 更深邃的海洋蓝光晕 */
    radial-gradient(at 100% 100%, rgba(14, 165, 233, 0.5) 0px, transparent 60%), /* 极其清透的天蓝光晕 */
    radial-gradient(at 50% 10%, rgba(255, 255, 255, 0.8) 0px, transparent 50%);
  background-attachment:fixed;
}

button{
  padding:16px;
  margin:10px;
  font-size:18px;
  font-weight:600;
  border-radius:10px;
  width:260px;
  display:inline-block;
  box-sizing:border-box;
  cursor:pointer;
  
  /* ======================================================== */
  /* 【3D 实体按钮升级】所有按钮统一享有一模一样的 3D 水晶效果    */
  /* ======================================================== */
  /* 显明的纯白反射亮边，下方自带 3.5px 的实体承重边 */
  border-top: 1.5px solid rgba(255, 255, 255, 0.95);
  border-left: 1.5px solid rgba(255, 255, 255, 0.7);
  border-right: 1.5px solid rgba(255, 255, 255, 0.7);
  border-bottom: 3.5px solid #94a3b8; 
  
  /* 珍珠象牙白饱满渐变 */
  background: linear-gradient(180deg, #ffffff 0%, #f1f5f9 100%);
  color: #0f172a;
  
  box-shadow: 0 12px 24px -6px rgba(15, 23, 42, 0.18); 
  transition: all 0.15s cubic-bezier(0.16, 1, 0.3, 1);
}
/* 所有按钮统一享有超强物理下压反馈 */
button:active{
  transform: translateY(2.5px); /* 点击时真实下压 */
  border-bottom-width: 1px;   /* 底部厚边框瞬间压扁 */
  box-shadow: 0 4px 8px rgba(15, 23, 42, 0.15);
}

input{
  padding:16px;
  font-size:18px;
  width:220px;
  border-radius:10px;
  
  /* 输入框 3D 水晶磨砂化，边缘勾勒清晰明显的白边 */
  border: 1.5px solid rgba(15, 23, 42, 0.15);
  background: rgba(255, 255, 255, 0.5);
  color: #0f172a;
  outline: none;
  box-sizing: border-box;
  transition: all 0.3s ease;
}
/* 输入框聚焦时发光 */
input:focus{
  border-color: #0284c7;
  background: #ffffff;
  box-shadow: 0 0 15px rgba(2, 132, 199, 0.25);
}

#scanner{
  width:440px;
  /* 更改：限制最大宽度为 100% 绝对不超出卡片，并在块级排列下依靠 margin 强制双向对称居中 */
  max-width: 100%;
  margin: 15px auto;
  display: block;
  
  border-radius:12px;
  overflow:hidden;
  box-sizing: border-box;
}

.success{
  background: rgba(212, 237, 218, 0.95);
  color: #155724;
  border: 1.5px solid #c3e6cb;
  border-radius:10px;
  padding:16px;
}

.duplicate{
  background: rgba(255, 243, 205, 0.95);
  color: #856404;
  border: 1.5px solid #ffeeba;
  border-radius:10px;
  padding:16px;
}

.error{
  background: rgba(248, 215, 218, 0.95);
  color: #721c24;
  border: 1.5px solid #f5c6cb;
  border-radius:10px;
  padding:16px;
}

.loginBox{
  margin-top:50px;
  
  /* ======================================================== */
  /* 【极致显明毛玻璃卡片】                                    */
  /* ======================================================== */
  background: rgba(255, 255, 255, 0.45); /* 晶莹剔透的半透明玻璃基底 */
  backdrop-filter: blur(24px); /* 将底部的海洋蓝光晕优雅揉碎并透出来 */
  -webkit-backdrop-filter: blur(24px);
  
  border-radius: 20px;
  padding: 30px 20px;
  max-width: 360px;
  margin-left: auto;
  margin-right: auto;
  box-sizing: border-box;
  
  /* 1.5px 粗细的纯白高光边缘，轮廓极其显眼明显 */
  border: 1.5px solid rgba(255, 255, 255, 0.85); 
  
  box-shadow: 
    0 25px 50px -12px rgba(15, 23, 42, 0.18),
    0 1px 0px rgba(255, 255, 255, 0.8) inset;
}

/* === 以下为您原有的其他页面 ID，完全独立且统一享有最新的显明 3D 玻璃质感 === */

  /* 更改：在扫码卡片内部强制开启绝对垂直居中轴，强力校正 html5-qrcode 库的走位偏右问题 */
  display: flex;

#manualPage{

  backdrop-filter: blur(24px);

  border-radius: 20px;
  padding: 30px 20px;

  box-shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.18), 0 1px 0px rgba(255, 255, 255, 0.8) inset;

#dashboardPage{

  border-radius: 20px;
  padding: 30px 20px;

  box-sizing: border-box;
  border: 1px solid rgba(255, 255, 255, 0.85);
  box-shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.18), 0 1px 0px rgba(255, 255, 255, 0.8) inset;

#resultPage{

  box-shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.18), 0 1px 0px rgba(255, 255, 255, 0.8) inset;
}

</style>

<script>

// =====================================
// CONFIG
// =====================================

const API_URL =
"https://script.google.com/macros/s/AKfycbyF7v7Kzddzb32-s4LJSN4NsseNcZqrLsXeTWVuuBpq5pMpMZFfEiTqFtmlfbRfUXeOpQ/exec";

// =====================================
// FIREBASE
// =====================================

firebase.initializeApp({

  databaseURL:
  "https://senior-service-check-in-default-rtdb.asia-southeast1.firebasedatabase.app/"

});

const db = firebase.database();

// realtime counter

db.ref("count").on("value", snap => {

  document.getElementById("count")
    .innerText = snap.val() || 0;

});

// =====================================
// GLOBALS
// =====================================

let scanner = null;
let scannerStarted = false;
let currentMode = "";
let scanCooldown = false;
let idleTimer = null;

const DEFAULT_IDLE_LIMIT = 10 * 60 * 1000;
const WARMUP_KEY = "gas_warmup_last";
const WARMUP_COOLDOWN = 4 * 60 * 1000;

// =====================================
// PRELOAD BEEP
// =====================================

const beep = new Audio(
"https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg"
);

beep.preload = "auto";

// =====================================
// APP START
// =====================================

window.addEventListener("load", () => {

  // initial warm
  smartWarmup("full");

  // keep warm
  setInterval(() => {

    smartWarmup("smart");

  }, 4 * 60 * 1000);
  
  ["click","touchstart","keypress"].forEach(event => {

  document.addEventListener(event, () => {

    if (
      sessionStorage.getItem("auth") === "true"
    ) {
      resetIdleTimer();
    }

  });

});
  
  // =====================================
  // LOGIN CHECK
  // =====================================

  const auth =
    sessionStorage.getItem("auth");

  if (auth === "true") {

    startSessionMonitor();

    showApp();

  } else {

    showLoginPage();

  }

});

// =====================================
// LOGIN
// =====================================

function login() {

  smartWarmup("login_fallback");
  
  const username =
    document.getElementById("username")
      .value
      .trim();

  const password =
    document.getElementById("password")
      .value
      .trim();

  // =====================================
  // EMPTY CHECK
  // =====================================

  if (!username || !password) {

    document.getElementById("loginError")
      .innerText =
      "Enter username and password";

    return;

  }

  // =====================================
  // LOADING
  // =====================================

  showLoginLoading();

  // =====================================
  // TIMEOUT PROTECTION
  // =====================================

  const controller =
    new AbortController();

  const timeout =
    setTimeout(() => {

      controller.abort();

    }, 20000);

  // =====================================
  // LOGIN REQUEST
  // =====================================

  fetch(

    API_URL +

    "?action=login" +

    "&username=" +
    encodeURIComponent(username) +

    "&password=" +
    encodeURIComponent(password),

    {

      signal: controller.signal,

      cache: "no-store",

      keepalive: true

    }

  )

  .then(r => r.json())

  .then(data => {

    // =====================================
    // SUCCESS
    // =====================================

    if (data.success) {

      sessionStorage.setItem(
        "auth",
        "true"
      );

      sessionStorage.setItem(
        "username",
        data.username
      );

      sessionStorage.setItem(
        "role",
        data.role
      );

      // =====================================
      // SAVE SESSION TOKEN
      // =====================================

      sessionStorage.setItem(
        "sessionToken",
        data.token
      );

      sessionStorage.setItem(
        "idleLimit",
        data.idleLimit
      );
      
      resetIdleTimer();

      // start session monitor
      startSessionMonitor();

      showApp();

      return;

    }

    // =====================================
    // INVALID LOGIN
    // =====================================

    document.getElementById("loginError")
      .innerText =
      "Invalid username or password";

    showLoginPage();

  })

  // =====================================
  // NETWORK ERROR / TIMEOUT
  // =====================================

  .catch(err => {

    // timeout
    if (err.name === "AbortError") {

      document.getElementById("loginError")
        .innerText =
        "Login timeout";

      showLoginPage();

      return;

    }

    // other network errors
    document.getElementById("loginError")
      .innerText =
      "Network error";

    showLoginPage();

  })

  // =====================================
  // CLEAR TIMER
  // =====================================

  .finally(() => {

    clearTimeout(timeout);

  });

}

// =====================================
// LOGOUT
// =====================================

function logout() {

  // stop monitor
  if (sessionMonitor) {

    clearInterval(
      sessionMonitor
    );

    sessionMonitor = null;

  }

  sessionStorage.clear();

  goHome();

  hideAll();

  showLoginPage();

}

let sessionMonitor = null;

function startSessionMonitor() {

  // avoid duplicate interval
  if (sessionMonitor) {
    return;
  }

  sessionMonitor = setInterval(async () => {

    try {

      const username =
        sessionStorage.getItem(
          "username"
        );

      const token =
        sessionStorage.getItem(
          "sessionToken"
        );

      // no session
      if (!username || !token) {
        return;
      }

      const res = await fetch(

        API_URL +

        "?action=verifySession" +

        "&username=" +
        encodeURIComponent(username) +

        "&token=" +
        encodeURIComponent(token),

        {
          cache: "no-store",
          keepalive: true
        }

      );

      const data =
        await res.json();

      // =====================================
      // SESSION INVALID
      // =====================================

      if (!data.success) {

        clearInterval(
          sessionMonitor
        );

        sessionMonitor = null;

        alert(
          "账号已在其他设备登录"
        );

        logout();

      }

    } catch (err) {

      console.log(
        "session verify failed",
        err
      );

    }

  }, 30000);

}

function resetIdleTimer(){

clearTimeout(idleTimer);

const idleLimit=

Number(
sessionStorage.getItem(
"idleLimit"
)
) ||

DEFAULT_IDLE_LIMIT;

idleTimer=setTimeout(()=>{

alert("Session expired");

logout();

},idleLimit);

}

// =====================================
// SHOW APP
// =====================================

function showApp() {

  hideAll();

  document.getElementById("home")
    .style.display = "block";

}

// =====================================
// SHOW LOGIN PAGE
// =====================================

function showLoginPage() {

  hideAll();

  document.getElementById("loginPage")
    .style.display = "block";

  // reset UI state
  document.getElementById("loginError")
    .innerHTML = "";

  document.getElementById("username").value = "";
  document.getElementById("password").value = "";

}

// =====================================
// LOGIN LOADING
// =====================================

function showLoginLoading() {

  document.getElementById("loginError")
    .innerHTML =
    "⏳ Logging in...";

}

function formatTime(ts) {
  const d = new Date(ts);

  return d.toLocaleString("sv-SE", {
    timeZone: "Asia/Kuala_Lumpur",
    hour12: false
  }).replace(",", "");
}

// =====================================
// API CALL
// =====================================

function callAPI(id) {

  showLoading();

  const controller = new AbortController();

  const timeout = setTimeout(() => {

    controller.abort();

  }, 20000);

  fetch(

    API_URL + "?id=" +
    encodeURIComponent(id),

    {
      signal: controller.signal,
      cache: "no-store",
      keepalive: true
    }

  )

  .then(r => r.json())

  .then(data => {

    handleResult(data);

  })

  .catch(() => {

    handleResult({

      type: "error",

      message:
      "Network error / timeout"

    });

  })

  .finally(() => {

    clearTimeout(timeout);

  });

}

// =====================================
// OPEN SCAN
// =====================================

async function openScan() {

  currentMode = "scan";

  hideAll();

  document.getElementById("scanPage")
    .style.display = "block";

  // =====================================
  // CREATE SCANNER ONCE
  // =====================================

  if (!scanner) {

    scanner = new Html5Qrcode("scanner");

  }

  // =====================================
  // IF ALREADY STARTED
  // JUST RESUME
  // =====================================

  if (scannerStarted) {

    try {

      await scanner.resume();

      scanCooldown = false;

    } catch (err) {

      console.log(err);

    }

    return;

  }

  // =====================================
  // FIRST START
  // =====================================

  try {

    await scanner.start(

      {
        facingMode: "environment"
      },

      {
        fps: 15,
        qrbox: 250,
        aspectRatio: 1
      },

      onScanSuccess

    );

    scannerStarted = true;

    scanCooldown = false;

  } catch (err) {

    alert("Camera failed");

    console.log(err);

  }

}

// =====================================
// SCAN SUCCESS
// =====================================

async function onScanSuccess(text) {

  if (scanCooldown) return;

  scanCooldown = true;

  if (navigator.vibrate) {

    navigator.vibrate(80);

  }

  await scanner.pause(true);

  callAPI(text);

}

// =====================================
// MANUAL
// =====================================

function openManual() {

  currentMode = "manual";

  hideAll();

  document.getElementById("manualPage")
    .style.display = "block";

  const input =
    document.getElementById("idInput");

  input.value = "";

  input.focus();

}

function manualCheck() {

  const id =
    document.getElementById("idInput")
      .value
      .trim();

  if (!id) return;

  callAPI(id);

}

// =====================================
// HANDLE RESULT
// =====================================

function handleResult(data) {

  resetIdleTimer();
  
  hideAll();

  const page =
    document.getElementById("resultPage");

  page.style.display = "block";

  let html = "";

  // =====================================
  // SUCCESS
  // =====================================

  if (data.type === "success") {

    page.className = "success";

    html = `

      <div style="
      font-size:70px;
      color:green;
      font-weight:bold;
      ">
        ${data.chineseName}
      </div>

      <div style="
      font-size:34px;
      ">
        ${data.englishName}
      </div>

      <br>

      <div style="
      font-size:22px;
      ">
        Checked In
      </div>

      <div style="
      font-size:24px;
      ">
        ${formatTime(data.time)}
      </div>

    `;

    beep.currentTime = 0;

    beep.play();

    db.ref("count")
      .transaction(v => (v || 0) + 1);

  }

  // =====================================
  // DUPLICATE
  // =====================================

  else if (data.type === "duplicate") {

    page.className = "duplicate";

    html = `

      <div style="
      font-size:50px;
      color:orange;
      ">
        Already Checked In
      </div>

      <br>

      <div style="
      font-size:60px;
      ">
        ${data.chineseName}
      </div>

      <div style="
      font-size:34px;
      ">
        ${data.englishName}
      </div>

      <br>

      <div style="
      font-size:22px;
      ">
        Check-in Time
      </div>

      <div style="
      font-size:24px;
      ">
        ${formatTime(data.time)}
      </div>

    `;

  }

  // =====================================
  // ERROR
  // =====================================

  else {

    page.className = "error";

    html = `

      <div style="
      font-size:50px;
      color:red;
      ">
        ${data.message}
      </div>

    `;

  }

  document.getElementById("resultContent")
    .innerHTML = html;

}

// =====================================
// NEXT ACTION
// =====================================

async function nextAction() {

  if (currentMode === "scan") {

    hideAll();

    document.getElementById("scanPage")
      .style.display = "block";

    scanCooldown = false;

    if (scanner) {

      await scanner.resume();

    }

    return;

  }

  openManual();

}

// =====================================
// HOME
// =====================================

async function goHome() {

  hideAll();

  document.getElementById("home")
    .style.display = "block";

  scanCooldown = false;

  if (scanner && scannerStarted) {

    try {

      await scanner.pause(true);

    } catch(e){}

  }

}

// =====================================
// LOADING
// =====================================

function showLoading() {

  hideAll();

  const page =
    document.getElementById("resultPage");

  page.style.display = "block";

  page.className = "";

  document.getElementById("resultContent")
    .innerHTML = `

      <div style="
      font-size:40px;
      ">
        ⏳ Checking...
      </div>

    `;

}

// =====================================
// HIDE ALL
// =====================================

function hideAll() {

  document.getElementById("loginPage")
    .style.display = "none";

  document.getElementById("home")
    .style.display = "none";

  document.getElementById("scanPage")
    .style.display = "none";

  document.getElementById("manualPage")
    .style.display = "none";

  document.getElementById("dashboardPage")
    .style.display = "none";
  
  document.getElementById("resultPage")
    .style.display = "none";

}

// ============================
// DASHBOARD API
// ============================

function loadDashboard() {

  fetch(API_URL + "?action=dashboard", {
    cache: "no-store"
  })
  .then(r => r.json())
  .then(d => {

    document.getElementById("d_total").innerText = d.total || 0;
    document.getElementById("d_checked").innerText = d.checked || 0;
    document.getElementById("d_pending").innerText = d.pending || 0;
    document.getElementById("d_a").innerText = d.a || 0;
    document.getElementById("d_b").innerText = d.b || 0;

  })
  .catch(() => {});

}

function openDashboard() {

  hideAll();

  document.getElementById("dashboardPage")
    .style.display = "block";

  loadDashboard(); // 进来就刷新一次

}


// ============================
// SMART WARMUP SYSTEM
// ============================

function shouldWarmup() {

  const last =
    Number(
      localStorage.getItem(WARMUP_KEY) || "0"
    );

  return (
    Date.now() - last >
    WARMUP_COOLDOWN
  );

}

function smartWarmup(type = "smart") {

  if (!shouldWarmup()) return;

  const url =

    API_URL +

    "?action=warmup" +

    "&type=" + encodeURIComponent(type);

  try {

    navigator.sendBeacon(url);

  } catch (err) {}

  localStorage.setItem(
    WARMUP_KEY,
    Date.now().toString()
  );

}
